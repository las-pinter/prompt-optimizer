model_id: llama
display_name: Meta Llama (llama-2 / llama-3 / llama-4 family)
vendor: Meta
api_type: varies

chat_template:
  llama2:
    system_delivery: inline_tokens
    format: "<s>[INST] <<SYS>>\n{system}\n<</SYS>>\n\n{user} [/INST]"
    special_tokens: ["<s>", "</s>", "[INST]", "[/INST]", "<<SYS>>", "<</SYS>>"]
  llama3:
    system_delivery: inline_tokens
    format: "<|begin_of_text|><|start_header_id|>system<|end_header_id|>\n{system}<|eot_id|><|start_header_id|>user<|end_header_id|>\n{user}<|eot_id|><|start_header_id|>assistant<|end_header_id|>"
    special_tokens:
      - "<|begin_of_text|>"
      - "<|start_header_id|>"
      - "<|end_header_id|>"
      - "<|eot_id|>"

sub_families:
  llama-2:
    prompt_style: default
    cot_policy: inject
    examples: never
    raw:
      description: "Llama 2 (7B, 13B, 70B)"
      chat_template: llama2
      max_system_prompt_tokens: 512
      supports_reasoning: false
      cot_benefit: true

  llama-3:
    prompt_style: default
    cot_policy: inject
    examples: never
    raw:
      description: "Llama 3 (8B, 70B)"
      chat_template: llama3
      max_system_prompt_tokens: null
      supports_reasoning: false
      cot_benefit: true

  llama-3.1:
    prompt_style: default
    cot_policy: inject
    examples: never
    raw:
      description: "Llama 3.1 (8B, 70B, 405B)"
      chat_template: llama3
      max_system_prompt_tokens: null
      supports_reasoning: false
      cot_benefit: true
      supports_405k_context: true

  llama-3.2:
    prompt_style: default
    cot_policy: inject
    examples: never
    raw:
      description: "Llama 3.2 (3B, 11B)"
      chat_template: llama3
      max_system_prompt_tokens: null
      supports_reasoning: false
      cot_benefit: true
      edge_optimized: true

  llama-3.3:
    prompt_style: default
    cot_policy: inject
    examples: never
    raw:
      description: "Llama 3.3 (70B)"
      chat_template: llama3
      max_system_prompt_tokens: null
      supports_reasoning: false
      cot_benefit: true

  llama-4:
    prompt_style: chunked
    cot_policy: inject
    examples: never
    raw:
      description: "Llama 4 Scout / Maverick (MoE, giant context)"
      chat_template: llama3
      max_system_prompt_tokens: null
      supports_reasoning: false
      cot_benefit: true
      moe: true
      chunked_context: true
      chunk_header_format: "# Part {{chunk_number}}"

preferences:
  formatting: explicit
  chain_of_thought: helpful
  markdown: limited
  verbosity: medium
  xml_tags: poor
  nested_instructions: limited
  role_play: moderate
  explicit_context: required

warnings:
  - You MUST use the correct chat template for the specific Llama version (2 vs 3 templates differ significantly)
  - Without proper special tokens, the model may ignore the system prompt entirely
  - Keep instructions simple and non-nested; complexity degrades output quality
  - Llama 2 is sensitive to token count in system prompts — keep them under ~512 tokens
  - Do not use markdown headers (###) as structural guides — use plain labels instead
  - MoE models (Llama 4) benefit from chunked context with clear section headers

transformations:
  - id: apply_llama3_template
    description: Wrap system and user content in Llama 3 special tokens
    type: chat_template_wrap
    template: llama3
    condition: model_variant starts_with "llama-3"

  - id: apply_llama2_template
    description: Wrap system and user content in Llama 2 [INST]/<<SYS>> tokens
    type: chat_template_wrap
    template: llama2
    condition: model_version == 2

  - id: add_cot_instruction
    description: Add chain-of-thought instruction for reasoning tasks
    type: phrase_inject
    phrase: "Think step by step."
    position: end_of_system
    condition: task_type == "reasoning" and not has_cot_instruction

  - id: flatten_nested_instructions
    description: Warn when instructions have more than 2 levels of nesting
    type: lint_warning
    check: instruction_nesting_depth > 2
    message: "Llama models degrade with deeply nested instructions. Consider flattening to a simple numbered list."

  - id: strip_xml_tags
    description: Convert XML-style tags to plain-text headers for Llama
    type: xml_to_headers
    condition: has_xml_tags

  - id: add_no_intro_outro
    description: Add anti-verbosity directive (all Llama)
    type: phrase_inject
    phrase: "Do not write an introduction. Do not write a summary. Return only the requested data."
    position: end_of_system

  - id: apply_cot_policy
    description: Apply sub_family CoT policy
    type: cot_policy

  - id: apply_prompt_style
    description: Apply sub_family prompt style
    type: prompt_style

  - id: chunk_context_for_llama4
    description: Split long inputs into logical chunks with headers (Llama 4)
    type: xml_rewrite
    target_block: context_chunks
    condition: model_variant starts_with "llama-4"

sources:
  - https://llama.meta.com/docs/model-cards-and-prompt-formats/meta-llama-2/
  - https://llama.meta.com/docs/model-cards-and-prompt-formats/meta-llama-3/
  - https://github.com/meta-llama/prompt-ops
